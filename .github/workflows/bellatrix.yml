name: Bellatrix native Zed integration

on:
  pull_request:
    paths:
      - 'crates/bellatrix_*/**'
      - 'crates/workspace/src/status_bar.rs'
      - 'crates/workspace/src/workspace.rs'
      - 'crates/icons/src/icons.rs'
      - 'assets/icons/bellatrix_mde_*.svg'
      - 'crates/zed/Cargo.toml'
      - 'crates/zed/src/main.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bellatrix.yml'
  push:
    branches: [main]
    paths:
      - 'crates/bellatrix_*/**'
      - 'crates/workspace/src/status_bar.rs'
      - 'crates/workspace/src/workspace.rs'
      - 'crates/icons/src/icons.rs'
      - 'assets/icons/bellatrix_mde_*.svg'
      - 'crates/zed/Cargo.toml'
      - 'crates/zed/src/main.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bellatrix.yml'

concurrency:
  group: bellatrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bellatrix:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Zed pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Resolve Zed and Bellatrix dependencies
        shell: pwsh
        run: cargo +1.98.1 metadata --format-version 1 > $null
      - name: Check Bellatrix host and Zed runtime together
        shell: pwsh
        run: |
          cargo +1.98.1 check -p bellatrix_zed_host -p zed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test headless Bellatrix domain and Cordis lifecycle
        shell: pwsh
        run: |
          $packages = @(
            'bellatrix_project', 'bellatrix_mde_model',
            'bellatrix_mde_modeling', 'bellatrix_mde_cordis',
            'bellatrix_mde_rust_generator', 'bellatrix_mde_html_exporter'
          )
          foreach ($package in $packages) {
            cargo +1.98.1 test -p $package
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check Bellatrix Workbench warnings
        shell: pwsh
        run: cargo +1.98.1 clippy -p bellatrix_mde_workbench --all-targets -- -D warnings
