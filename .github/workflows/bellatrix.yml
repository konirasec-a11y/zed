name: Bellatrix native Zed integration

on:
  pull_request:
    paths:
      - 'crates/bellatrix_*/**'
      - 'crates/workspace/src/status_bar.rs'
      - 'crates/workspace/src/workspace.rs'
      - 'crates/icons/src/icons.rs'
      - 'assets/icons/bellatrix_mde_*.svg'
      - 'crates/zed/Cargo.toml'
      - 'crates/zed/src/main.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bellatrix.yml'
      - 'script/bellatrix_mde/**'
  push:
    branches: [main]
    paths:
      - 'crates/bellatrix_*/**'
      - 'crates/workspace/src/status_bar.rs'
      - 'crates/workspace/src/workspace.rs'
      - 'crates/icons/src/icons.rs'
      - 'assets/icons/bellatrix_mde_*.svg'
      - 'crates/zed/Cargo.toml'
      - 'crates/zed/src/main.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bellatrix.yml'
      - 'script/bellatrix_mde/**'

concurrency:
  group: bellatrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bellatrix:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Zed pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Resolve Zed and Bellatrix dependencies
        shell: pwsh
        run: cargo +1.98.1 metadata --no-deps --format-version 1 > $null
      - name: Check Bellatrix host and Zed runtime together
        shell: pwsh
        run: |
          cargo +1.98.1 check -p bellatrix_mde -p bellatrix_mde_cordis -p bellatrix_mde_ui -p bellatrix_zed_host -p zed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run existing Bellatrix BDD integrations
        shell: pwsh
        run: ./script/bellatrix_mde/smoke.ps1
      - name: Check Bellatrix UI warnings
        shell: bash
        run: ./script/clippy -p bellatrix_mde_ui
