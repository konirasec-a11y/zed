[package]
publish.workspace = true
name = "bellatrix_mde_workbench"
version = "0.1.0"
edition.workspace = true
# Zed's pinned toolchain; the older GPUI Kit frontend remains separate.
rust-version = "1.98.1"

[dependencies]
bellatrix_project = { path = "../bellatrix_project" }
bellatrix_mde_model = { path = "../bellatrix_mde_model" }
bellatrix_mde_cordis = { path = "../bellatrix_mde_cordis" }
tokio.workspace = true
ui_input.workspace = true
gpui.workspace = true
ui.workspace = true
workspace.workspace = true
serde_json.workspace = true
bellatrix_design_system = { path = "../bellatrix_design_system" }
bellatrix_ui_uml = { path = "../bellatrix_ui_uml" }
bellatrix_ui_symbols = { path = "../bellatrix_ui_symbols" }

# Zed d94f32a1 locks Merman's prerelease crates as a matched family.
# Without these exact constraints, Cargo may select 0.8.0 stable companions
# for merman 0.8.0-alpha.5, which have incompatible SVG/text APIs.
# Keep this set aligned with vendor/zed/Cargo.lock until Zed itself upgrades.
merman-core = { version = "=0.8.0-alpha.5", default-features = false }
merman-render = { version = "=0.8.0-alpha.5", default-features = false }
dugong = { version = "=0.8.0-alpha.5", default-features = false }
manatee = { version = "=0.8.0-alpha.5", default-features = false }
