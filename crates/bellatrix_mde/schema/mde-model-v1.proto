syntax = "proto3";
// Engine-MDE's model wire representation (not the Platform ProjectDocument).
// Preserve package bellatrix.v1 and existing field numbers for compatibility.
package bellatrix.v1;

// Documented wire contract. Rust currently derives prost::Message directly,
// so users do not need protoc during the first development milestone.
message Project {
  uint32 version = 1;
  string id = 2;
  string name = 3;
  repeated Element elements = 4;
  repeated Relation relations = 5;
  repeated Diagram diagrams = 6;
  optional string root_model = 7;
  reserved 8, 9;
  reserved "explorer_parents_json", "explorer_diagram_occurrences_json";
  repeated HierarchyPlacement hierarchy = 10;
  optional bytes mdj_provenance_json = 11;
  // Canonical CompositionPlacement map, not source provenance.
  optional bytes composition_json = 12;
  repeated AssociationKnowledge association_knowledge = 13;
}
message AssociationKnowledge {
  string association_id = 1;
  repeated string navigation_unverified = 2;
}
message HierarchyPlacement {
  string subject_id = 1;
  optional string parent_id = 2;
  optional ViewOccurrence occurrence = 3;
}
message ViewOccurrence {
  string diagram_id = 1;
  string view_id = 2;
  repeated string member_path = 3;
}
message Element {
  string id = 1;
  string kind = 2;
  string name = 3;
  optional string label = 4;
  optional string description = 5;
  bytes properties_json = 6;
  repeated Annotation annotations = 7;
  repeated Implementation implementations = 8;
  optional Content content = 9;
}
message Annotation { string language = 1; string source = 2; }
message Implementation { string language = 1; string source = 2; }
message Content { bool text = 1; bytes bytes = 2; }
message Relation {
  string id = 1;
  string kind = 2;
  string from = 3;
  string to = 4;
  bytes properties_json = 5;
}
message Diagram {
  string id = 1;
  string name = 2;
  double width = 3;
  double height = 4;
  repeated View views = 5;
  // UMLDI diagram type and context, distinct from View subjects.
  // Presence and nonblank value are required by the model decoder.
  optional string uml_di_type = 6;
  repeated string model_elements = 7;
  optional string interaction_kind = 8;
}
message View {
  string id = 1;
  optional string subject = 2;
  optional string label = 3;
  // Layout extents retain missing/null, resolved nonnegative numbers, or a
  // typed {original, reason:"negative_extent"} unresolved value. Unresolved
  // extents are authored data, never negative rendered sizes.
  bytes geometry_json = 4;
  bytes style_json = 5;
  sint32 z_index = 6;
  bytes draft_json = 7;
  optional bytes timing_json = 8;
  optional bytes endpoints_json = 9;
  // Ordered authored containment; no redundant parent identifier.
  repeated View children = 10;
  // ViewPresentation from the presentation contract, including typed subject
  // label bindings/options-source references, interface icon/connection bindings,
  // style inheritance and residual fields.
  optional bytes presentation_json = 11;
}
