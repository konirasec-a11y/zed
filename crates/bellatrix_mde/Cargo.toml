[package]
publish.workspace = true
name = "bellatrix_mde"
version = "0.1.0"
edition.workspace = true
rust-version = "1.98.1"

[lib]
path = "src/mde.rs"

[features]
default = []
cordis = ["dep:cordis-rs", "dep:tokio"]

[dependencies]
cordis-rs = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
num-bigint = "0.4.8"
sha2.workspace = true
uuid = { workspace = true, features = ["v4"] }
tera.workspace = true
toml = { workspace = true, features = ["display"] }
base64.workspace = true
prost.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip", "arbitrary_precision"] }
thiserror.workspace = true
petgraph.workspace = true
