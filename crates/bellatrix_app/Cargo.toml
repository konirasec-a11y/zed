[package]
name = "bellatrix_app"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Independent Bellatrix desktop frontend for typed UML contracts"

[[bin]]
name = "bellatrix"
path = "src/main.rs"

[dependencies]
bellatrix_mde_contracts = { path = "../bellatrix_mde_contracts", default-features = false }
bellatrix_design_system = { path = "../bellatrix_design_system", default-features = false }
bellatrix_ui_panels = { path = "../bellatrix_ui_panels" }
bellatrix_ui_uml = { path = "../bellatrix_ui_uml", default-features = false }
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
serde_json.workspace = true
unicode-segmentation.workspace = true
