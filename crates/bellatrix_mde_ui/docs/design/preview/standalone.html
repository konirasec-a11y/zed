<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>StarUML · UI Study v3</title><style>/* StarUML workbench study — semantic tokens only, independent from browser DOM. */
:root {
  font-family: Inter, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  --font-xs: 10px; --font-sm: 11px; --font-base: 12px; --font-md: 13px;
  --font-lg: 14px; --font-xl: 20px;
  --radius-sm: 4px; --radius-md: 6px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px;
}
[data-theme='dark'] {
  color-scheme: dark;
  --app-bg: #1b1d20; --rail: #1e2023;
  --surface-1: #222427; --surface-2: #292b30; --surface-3: #34373c;
  --border: #373b41; --border-soft: #30343a; --border-faint: #292d32;
  --text: #c8cbd1; --text-strong: #f0f1f3;
  --muted: #9ba0a9; --muted-deep: #828994;
  --accent: #88b1fa; --accent-tint: #29374b;
  --active: #2c3749; --active-outline: #6d9de7;
  --canvas: #24272c; --canvas-grid: #2b3036; --canvas-grid-strong: #343a42;
  --paper-white: #323841; --diagram-text: #e9edf3;
  --diagram-edge: #a4b0bf; --diagram-border: #8a97a7;
  --diagram-header: #3c444f; --diagram-muted: #b9c2ce;
  --selection: #83b5ff; --input-bg: #1f2124;
  --shadow: rgba(0,0,0,.34);
}
[data-theme='light'] {
  color-scheme: light;
  --app-bg: #f7f8fa; --rail: #f7f8fa;
  --surface-1: #fdfdfd; --surface-2: #f3f5f7; --surface-3: #e9edf1;
  --border: #dee2e7; --border-soft: #eaecf0; --border-faint: #f1f2f4;
  --text: #4c535d; --text-strong: #20262e;
  --muted: #697380; --muted-deep: #89929e;
  --accent: #3974cf; --accent-tint: #e7f0fe;
  --active: #e7effa; --active-outline: #3974cf;
  --canvas: #fafbfc; --canvas-grid: #f0f2f5; --canvas-grid-strong: #e6e9ed;
  --paper-white: #ffffff; --diagram-text: #293544;
  --diagram-edge: #7a8897; --diagram-border: #788797;
  --diagram-header: #f1f4f7; --diagram-muted: #637286;
  --selection: #3a7fe2; --input-bg: #fff;
  --shadow: rgba(31,41,55,.10);
}

* { box-sizing: border-box; }
html, body, #root { margin: 0; height: 100%; width: 100%; min-width: 850px; }
body { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 12px; line-height: 1.4; }
button,input,select,textarea { font-family: inherit; font-size: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
input:focus-visible,button:focus-visible,select:focus-visible { outline: 2px solid var(--accent); }
::selection { background: var(--accent-tint); color: var(--text-strong); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border); border: 2px solid var(--surface-1); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

/* Workbench components. Shared notation specimens live in diagrams.css. */
.app-root {
  width: 100%; height: 100dvh; min-height: 480px;
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--app-bg); color: var(--text);
}
.app-titlebar {
  flex: 0 0 43px; height: 43px; padding: 0 15px;
  display: flex; align-items: center; gap: 14px;
  background: var(--surface-1); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 9px; font-size: 13px;
  font-weight: 660; letter-spacing: -.2px; color: var(--text-strong); white-space: nowrap; }
.brand-mark { width: 22px; height: 22px; display: grid; place-items: center; color: var(--text-strong); }
.title-divider { height: 18px; width: 1px; flex: 0 0 1px; background: var(--border); }
.menu-entries { height: 100%; display: flex; align-items: center; gap: 0; }
.menu-entry { display: inline-flex; align-items: center; height: 30px; padding: 0 10px;
  font-size: 11px; color: var(--muted); cursor: default; user-select: none; }
.titlebar-fill,.bottom-flex { flex: 1; }
.project-crumb { display: flex; align-items: center; gap: 8px; font-size: 11px;
  white-space: nowrap; color: var(--muted); }
.theme-toggle { display: flex; align-items: center; gap: 7px; border: 1px solid var(--border);
  color: var(--text); background: var(--surface-2); border-radius: 4px;
  padding: 0 10px; height: 27px; font-size: 11px; }
.theme-toggle:hover { background: var(--surface-3); }
.main-frame { flex: 1; display: grid; min-height: 0; min-width: 0; }
.center-column { grid-column: 4; min-width: 0; min-height: 0; display: flex; overflow: hidden; }
.activity-rail { grid-column: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: space-between; background: var(--rail); border-right: 1px solid var(--border);
  padding: 9px 0 8px; min-height: 0; }
.rail-main, .rail-bottom { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.rail-action { width: 41px; height: 36px; display: grid; place-items: center; border: 0;
  background: transparent; color: var(--muted); position: relative; }
.rail-action:hover { color: var(--text-strong); background: var(--surface-2); }
.rail-action.is-active { color: var(--accent); background: var(--active); }
.rail-action.is-active:before { content: ''; position: absolute; left: 0; top: 7px;
  height: 22px; width: 2px; background: var(--accent); }
.rail-sample-mark { font-size: 9px; color: var(--muted-deep); user-select: none; }
.icon-button { display: inline-flex; align-items: center; justify-content: center;
  height: 28px; min-width: 28px; flex-shrink: 0;
  border: 0; border-radius: 3px; background: transparent; color: var(--muted); }
.icon-button.is-small { min-width: 25px; height: 25px; }
.icon-button:not(:disabled):hover { color: var(--text-strong); background: var(--surface-3); }
.icon-button.is-active { color: var(--accent); background: var(--accent-tint); }
.app-root button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
@media (max-width: 900px) {
  .app-titlebar { padding: 0 9px; gap: 9px; }
  .menu-entry { padding: 0 6px; }
  .project-crumb { display: none; }
}

.left-sidebar { grid-column: 2; border-right: 1px solid var(--border); }
.right-inspector { grid-column: 6; border-left: 1px solid var(--border); }
.left-sidebar,.right-inspector { display: flex; flex-direction: column; min-width: 0;
  min-height: 0; overflow: hidden; background: var(--surface-1); }
.left-project-panel,.explorer-panel { display: flex; flex-direction: column; min-height: 33px; overflow: hidden; }
.toolbox-panel,.inspector-panel { display: flex; flex-direction: column; min-height: 0; flex: 1; overflow: hidden; }
.toolbox-panel.dock-closed,.inspector-panel.dock-closed { flex: 0 0 33px; }
.dock-panel-header { height: 33px; min-height: 33px; display: flex; justify-content: space-between;
  align-items: center; background: var(--surface-1); border-bottom: 1px solid var(--border-soft); }
.dock-panel-toggle { height: 100%; flex: 1; display: flex; gap: 7px; align-items: center;
  padding: 0 10px; color: var(--text); font-size: 11px; font-weight: 600;
  text-align: left; border: 0; background: transparent; min-width: 0; }
.dock-panel-toggle span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dock-panel-toggle svg { flex-shrink: 0; color: var(--muted-deep); }
.dock-panel-toggle:hover { background: var(--surface-2); }
.dock-panel-actions { flex: 0 0 auto; display: flex; padding: 0 6px; }
.header-icon { border: 0; background: transparent; display: grid; place-items: center;
  width: 24px; height: 23px; border-radius: 3px; color: var(--muted); }
.header-icon:hover { color: var(--text-strong); background: var(--surface-3); }
.resize-handle { z-index: 7; flex: 0 0 5px; position: relative; background: var(--surface-1);
  outline: none; touch-action: none; user-select: none; }
.resize-handle:before { content: ''; position: absolute; background: var(--border); pointer-events: none; }
.resize-horizontal { width: 5px; cursor: col-resize; }
.resize-horizontal:before { width: 1px; top: 0; bottom: 0; left: 2px; }
.resize-vertical { height: 5px; cursor: row-resize; }
.resize-vertical:before { height: 1px; left: 0; right: 0; top: 2px; }
.resize-handle:hover:before,.resize-handle:focus-visible:before { background: var(--accent); }
.resize-handle:hover { background: var(--accent-tint); }
.resize-handle:focus-visible { outline: 1px solid var(--accent); }
.layout-split-left { grid-column: 3; }
.layout-split-right { grid-column: 5; }
.is-resizing, .is-resizing * { user-select: none !important; cursor: inherit; }
.left-project-content { overflow-y: auto; flex: 1; min-height: 0; }

.project-group { height: 34px; display: flex; align-items: center; padding: 0 12px; gap: 8px;
  font-size: 11px; color: var(--muted); white-space: nowrap; }
.project-group span { overflow: hidden; text-overflow: ellipsis; }
.project-group svg:nth-child(2) { color: var(--muted); }
.diagram-list { padding: 2px 7px 9px 24px; }
.diagram-item { height: 29px; display: flex; align-items: center; gap: 9px; width: 100%;
  border: 0; background: transparent; color: var(--muted); padding: 0 10px;
  border-radius: 3px; font-size: 11px; text-align: left; white-space: nowrap; }
.diagram-item svg { flex-shrink: 0; }
.diagram-item span { overflow: hidden; text-overflow: ellipsis; }
.diagram-item:hover { background: var(--surface-2); }
.diagram-item.active { color: var(--text-strong); background: var(--active); font-weight: 550; }
.diagram-item.active svg { color: var(--accent); }
.toolbox-main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.side-search { height: 30px; min-height: 30px; display: flex; align-items: center; gap: 7px;
  background: var(--input-bg); border: 1px solid var(--border); border-radius: 3px;
  color: var(--muted); margin: 7px 9px; padding: 0 7px; }
.side-search input { min-width: 0; width: 100%; flex: 1; border: 0; outline: none;
  background: transparent; color: var(--text); font-size: 11px; }
.side-search input::placeholder { color: var(--muted-deep); }
.clean-button { padding: 0; display: flex; border: 0; background: none; color: var(--muted); }
.palette-scroll { overflow-y: auto; min-height: 0; flex: 1; padding: 5px 0 12px; }
.palette-group-header { display: flex; width: 100%; align-items: center; gap: 7px; height: 31px;
  background: transparent; border: 0; color: var(--text); padding: 0 10px;
  text-align: left; font-size: 11px; font-weight: 550; }
.palette-group-header svg { flex-shrink: 0; color: var(--muted-deep); }
.palette-group-header:hover { background: var(--surface-2); }
.palette-group-header span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group-count { margin-left: auto; flex-shrink: 0; font-size: 10px; color: var(--muted-deep); font-weight: 400; }
.palette-entries { display: flex; flex-direction: column; }
.palette-entry { width: 100%; min-height: 29px; height: 29px; display: flex; align-items: center; gap: 8px;
  padding: 0 10px 0 26px; text-align: left; color: var(--muted);
  background: transparent; border: 0; font-size: 11px; }
.palette-entry:hover { color: var(--text-strong); background: var(--surface-2); }
.palette-entry.active { color: var(--text-strong); background: var(--active); }
.palette-entry.active .palette-glyph { color: var(--accent); }
.palette-glyph { width: 23px; min-width: 23px; display: grid; place-items: center; color: var(--muted); }
.palette-label { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty-compact { padding: 16px; color: var(--muted); font-size: 11px; }

.explorer-inner { padding: 8px 6px 9px; min-height: 0; flex: 1; overflow-y: auto; }
.explorer-root,.tree-line { height: 27px; display: flex; gap: 7px; align-items: center;
  padding: 0 9px; color: var(--muted); font-size: 11px; white-space: nowrap; }
.explorer-root { color: var(--text); }
.explorer-root strong { overflow: hidden; text-overflow: ellipsis; font-weight: 560; }
.tree-line span:last-child { overflow: hidden; text-overflow: ellipsis; }
.tree-line svg { flex-shrink: 0; }
.tree-line.level-1 { padding-left: 22px; }
.tree-line.level-2 { padding-left: 37px; }
.tree-line.level-3 { padding-left: 52px; }
.tree-line.is-selected { color: var(--text-strong); background: var(--active); border-radius: 3px; }
.tree-line.is-selected svg { color: var(--accent); }
.tree-indent-spacer { display: none; }
.inspector-tabbar { height: 34px; min-height: 34px; display: flex; align-items: center; gap: 2px;
  border-bottom: 1px solid var(--border-soft); padding: 0 8px; }
.inspector-tabbar>button:not(.icon-button) { border: none; background: transparent; height: 100%;
  position: relative; padding: 0 9px; color: var(--muted); font-size: 11px; }
.inspector-tabbar>button:not(.icon-button).active { color: var(--text-strong); font-weight: 550; }
.inspector-tabbar>button.active:after { content:''; position: absolute; bottom: 0; left: 8px;
  right: 8px; height: 2px; background: var(--accent); }
.inspector-scroll { padding: 0 0 20px; overflow: auto; flex: 1; min-height: 0; }
.element-identity { margin: 12px 11px 13px; display: flex; align-items: center; gap: 10px;
  padding-bottom: 12px; border-bottom: 1px solid var(--border-soft); }
.identity-icon { width: 34px; height: 34px; display: grid; place-items: center;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 3px; color: var(--text); }
.element-identity h3 { font-size: 12px; line-height: 1.4; margin: 0 0 2px; color: var(--text-strong); }
.element-identity p { font-size: 10px; color: var(--muted); margin: 0; }
.section-heading { height: 28px; padding: 0 12px; display: flex; align-items: center;
  font-size: 10px; color: var(--muted-deep); font-weight: 600; letter-spacing: .4px; }
.property-list { padding: 0 11px 9px; display: flex; flex-direction: column; gap: 5px; }
.property-row { min-height: 27px; display: grid; align-items: center;
  grid-template-columns: 75px minmax(0,1fr); gap: 6px; font-size: 11px; }
.property-row>span { color: var(--muted); }
.faux-input,.faux-select { height: 27px; display: flex; align-items: center;
  justify-content: space-between; color: var(--text); padding: 0 7px; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  background: var(--input-bg); border: 1px solid var(--border); border-radius: 3px; font-size: 11px; }
.faux-select svg { margin-left: 7px; flex-shrink: 0; color: var(--muted); }
.muted-field { color: var(--muted); }
.attribute-row { display: flex; gap: 9px; margin: 0 11px; padding: 5px 8px;
  color: var(--muted); font: 11px ui-monospace, Consolas, monospace; }
.attribute-row span { color: var(--accent); }
.inspector-details { margin: 11px 10px 0; border-top: 1px solid var(--border-soft); }
.inspector-details summary { cursor: pointer; color: var(--muted); padding: 10px 2px;
  font-size: 11px; font-weight: 550; }
.inspector-details p { padding: 0 6px 7px; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
.metadata-row { height: 29px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 7px; color: var(--muted); font-size: 11px; }
.toggle-switch { height: 16px; width: 28px; padding: 2px; border-radius: 10px; display: flex;
  background: var(--surface-3); border: 1px solid var(--border); }
.toggle-switch span { width: 10px; height: 10px; border-radius: 50%; background: var(--muted-deep); }
.toggle-switch.on { justify-content: flex-end; background: var(--accent-tint); }
.toggle-switch.on span { background: var(--accent); }
.appearance-field { padding: 0 11px; display: flex; gap: 6px; align-items: center; height: 35px; }
.appearance-field>span { color: var(--muted); width: 66px; flex: 0 0 66px; }
.appearance-field .faux-input,.appearance-field .faux-select { flex: 1; }
.swatch { flex: 0 0 21px; width: 21px; height: 21px; border: 1px solid var(--border); border-radius: 3px; }
.dark-swatch { background: #fff; }
.stroke-swatch { background: #475569; }
.align-buttons { display: flex; gap: 4px; padding: 8px 11px 10px 83px; }
.align-buttons button { border: 1px solid var(--border); background: var(--input-bg);
  border-radius: 3px; color: var(--muted); width: 32px; height: 26px; }
.align-buttons button.on { color: var(--accent); }
.position-grid { display: grid; grid-template-columns: 12px 1fr 12px 1fr;
  align-items: center; gap: 7px; padding: 0 11px 10px; color: var(--muted); }

.workspace-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; width: 100%; }
.document-tabs { display: flex; align-items: center; flex: 0 0 35px; min-height: 35px;
  background: var(--surface-1); border-bottom: 1px solid var(--border); }
.doc-tab-area { display: flex; align-items: center; overflow-x: auto; overflow-y: hidden;
  height: 100%; width: 100%; scrollbar-width: none; }
.doc-tab-area::-webkit-scrollbar { display: none; }
.doc-tab { display: inline-flex; align-items: center; gap: 8px; padding: 0 14px;
  min-width: 0; max-width: 189px; height: 100%; flex-shrink: 0;
  position: relative; border: 0; border-right: 1px solid var(--border-faint);
  background: transparent; color: var(--muted); font-size: 11px; text-align: left; white-space: nowrap; }
.doc-tab span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.doc-tab svg { flex-shrink: 0; }
.doc-tab.active { background: var(--app-bg); color: var(--text-strong); }
.doc-tab.active svg { color: var(--accent); }
.doc-tab.active:after { content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 2px; background: var(--accent); }
.doc-tab:hover:not(.active) { background: var(--surface-2); }
.canvas-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 10px 0 16px; height: 35px; flex: 0 0 35px;
  border-bottom: 1px solid var(--border); background: var(--surface-1); }
.canvas-path { display: inline-flex; align-items: center; gap: 8px; min-width: 0;
  color: var(--muted); white-space: nowrap; font-size: 11px; }
.canvas-path strong { color: var(--text); font-size: 11px; font-weight: 550;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.canvas-path-sep { color: var(--muted-deep); }
.canvas-toolbar-controls { display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0; }
.tool-divider { height: 16px; width: 1px; background: var(--border); margin: 0 5px; }
.canvas-surface { position: relative; flex: 1; min-height: 0; overflow: hidden;
  background: var(--canvas); }
.canvas-grid-overlay { position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(to right, var(--canvas-grid) 1px, transparent 1px),
                    linear-gradient(to bottom, var(--canvas-grid) 1px, transparent 1px);
  background-size: 24px 24px; }
.canvas-grid-overlay:after { content: ''; position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(to right, var(--canvas-grid-strong) 1px, transparent 1px),
                    linear-gradient(to bottom, var(--canvas-grid-strong) 1px, transparent 1px);
  background-size: 120px 120px; opacity: .55; }
.canvas-content { position: absolute; inset: 20px 14px 35px; display: flex;
  align-items: center; justify-content: center; min-width: 0; }
.specimen-diagram { display: block; width: 100%; height: 100%; max-width: 1080px;
  max-height: 690px; overflow: visible; }
.diagram-type { font-size: 10px; color: var(--muted); }
.zoom-indicator { position: absolute; right: 17px; bottom: 13px;
  border: 1px solid var(--canvas-grid-strong); background: var(--paper-white);
  padding: 5px 8px; border-radius: 3px; color: var(--diagram-muted);
  font-size: 10px; user-select: none; }
.minimap { width: 141px; height: 101px; position: absolute; right: 17px; bottom: 46px;
  border: 1px solid var(--canvas-grid-strong); background: var(--paper-white);
  box-shadow: 0 3px 12px var(--shadow); border-radius: 3px; overflow: hidden; }
.minimap-top { display: flex; align-items: center; justify-content: space-between; height: 24px;
  padding: 0 8px; border-bottom: 1px solid var(--canvas-grid-strong);
  color: var(--diagram-muted); font-size: 9px; font-weight: 600; letter-spacing: .4px; }
.minimap-preview { position: relative; height: 75px; background-image:
  linear-gradient(to right, var(--canvas-grid) 1px,transparent 1px),
  linear-gradient(to bottom, var(--canvas-grid) 1px,transparent 1px); background-size: 10px 10px; }
.mini-box { position: absolute; width: 27px; height: 12px; border: 1px solid var(--diagram-edge); background: var(--diagram-header); }
.mini-box.a { left: 12px; top: 13px; }
.mini-box.b { left: 51px; top: 13px; }
.mini-box.c { left: 88px; top: 13px; }
.mini-box.d { left: 48px; top: 42px; }
.minimap-viewport { position: absolute; inset: 5px; border: 1px solid var(--selection);
  background: color-mix(in srgb, var(--selection) 4%, transparent); }
@media(max-width: 1180px) {
  .doc-tab { max-width: 155px; padding: 0 10px; }
  .canvas-path>span:first-child, .canvas-path-sep { display: none; }
}

.bottom-panel { display: flex; flex-direction: column; min-width: 0; min-height: 90px;
  background: var(--surface-1); border-top: 1px solid var(--border); }
.bottom-tabs { display: flex; align-items: center; height: 34px; min-height: 34px;
  padding: 0 10px; gap: 3px; border-bottom: 1px solid var(--border-soft); }
.bottom-tabs>svg { margin-right: 6px; color: var(--muted); }
.bottom-tabs button:not(.icon-button) { height: 100%; padding: 0 10px; background: transparent;
  color: var(--muted); border: 0; font-size: 11px; position: relative; }
.bottom-tabs button.active { color: var(--text-strong); }
.bottom-tabs button.active:after { content: ''; position: absolute; bottom: 0; left: 9px;
  right: 9px; height: 2px; background: var(--accent); }
.bottom-panel-body { flex: 1; overflow-y: auto; padding: 9px 16px; }
.bottom-panel-body p { color: var(--text); font-size: 11px; margin: 0; }
.bottom-panel-body p span { color: var(--muted); }
.statusbar { display: flex; justify-content: space-between; align-items: center;
  height: 24px; min-height: 24px; flex: 0 0 24px; padding: 0 13px;
  background: var(--surface-1); border-top: 1px solid var(--border);
  color: var(--muted-deep); font-size: 10px; }
.statusbar-left,.statusbar-right { display: flex; align-items: center; gap: 8px; }
.status-sep { width: 1px; height: 11px; background: var(--border); margin: 0 2px; }
.selected-toast { position: absolute; z-index: 20; bottom: 38px; left: 50%; transform: translateX(-50%);
  background: var(--surface-1); color: var(--text-strong); border: 1px solid var(--border);
  border-radius: 3px; padding: 8px 12px; font-size: 11px; box-shadow: 0 2px 12px var(--shadow); }
.selected-toast span { color: var(--muted); }

/* Latest StarUML screenshot modernization. Overrides legacy layout surfaces. */
/* Workbench chrome. Dense, desktop-first, no decorative cards or gradients. */
.app-titlebar {height:48px;flex:0 0 48px;gap:12px;padding:0 14px;background:var(--surface-1);border-bottom:1px solid var(--border);}
.brand {gap:8px;font-size:13px;font-weight:690;letter-spacing:-.22px;color:var(--text-strong);}
.brand-mark {width:24px;height:24px;color:var(--text-strong);}
.brand-mark svg {stroke-width:1.7px;}
.title-divider {height:19px;background:var(--border-soft);}
.menu-entry {font-size:12px;padding:0 9px;height:33px;border-radius:5px;color:var(--muted);}
.menu-entry:hover {background:var(--surface-2);color:var(--text);}
.project-crumb {gap:9px;color:var(--muted);font-size:12px;letter-spacing:-.1px;}
.project-crumb strong {font-weight:550;color:var(--text);}
.crumb-slash {color:var(--muted-deep);margin:0 1px;}
.titlebar-control {height:29px;padding:0 10px;display:inline-flex;align-items:center;gap:8px;color:var(--text);
  font-size:11px;background:transparent;border:1px solid transparent;border-radius:5px;white-space:nowrap;}
.titlebar-control:hover,.titlebar-control.is-open {background:var(--surface-2);border-color:var(--border-soft);}
.titlebar-control.icon-only {width:30px;justify-content:center;padding:0;color:var(--muted);}
.toolbar-menu-anchor {position:relative;}
.workspace-menu {position:absolute;z-index:50;top:37px;right:0;width:261px;overflow:hidden;padding:7px;
  background:var(--surface-1);border:1px solid var(--border);border-radius:7px;box-shadow:0 14px 40px var(--shadow);}
.workspace-menu .menu-caption {padding:8px 9px 5px;color:var(--muted-deep);font-size:10px;letter-spacing:.55px;font-weight:650;}
.workspace-menu>button {display:flex;width:100%;height:34px;align-items:center;gap:10px;padding:0 10px;text-align:left;
  color:var(--text);background:transparent;border:0;border-radius:4px;font-size:12px;}
.workspace-menu>button:hover {background:var(--surface-2);color:var(--text-strong);}
.workspace-menu>button>svg:first-child {color:var(--muted);flex-shrink:0;}
.workspace-menu>button>span {flex:1;}
.workspace-menu>button>small {color:var(--muted-deep);font-size:10px;}
.workspace-menu>button>svg:last-child:not(:first-child) {color:var(--accent);}
.menu-separator {height:1px;margin:5px 4px;background:var(--border-soft);}
.activity-rail {background:var(--rail);padding:11px 0 9px;border-right:1px solid var(--border);}
.rail-main {gap:5px;}
.rail-action {width:42px;height:38px;border-radius:5px;margin:0 3px;color:var(--muted);}
.rail-action.is-active {background:var(--surface-2);color:var(--text-strong);}
.rail-action.is-active:before {background:var(--accent);width:2px;height:22px;left:-3px;top:8px;border-radius:0 2px 2px 0;}
.rail-action:hover {border-radius:5px;}
.rail-sample-mark {font-size:9px;font-weight:600;color:var(--muted-deep);letter-spacing:.8px;}
.icon-button,.icon-button.is-small {border-radius:5px;min-width:28px;height:28px;}
.icon-button.is-active {color:var(--text-strong);background:var(--surface-2);}
.icon-button:hover {background:var(--surface-3);}
/* Swappable stack placement — middle canvas remains fixed. */
.main-frame.is-reversed .left-sidebar {grid-column:6;border-right:0;border-left:1px solid var(--border);}
.main-frame.is-reversed .right-inspector {grid-column:2;border-left:0;border-right:1px solid var(--border);}
.main-frame.is-reversed .layout-split-left {grid-column:5;}
.main-frame.is-reversed .layout-split-right {grid-column:3;}
.resize-handle {background:var(--surface-1);}
.resize-handle:before {background:var(--border);}
.resize-handle:hover:before,.resize-handle:focus-visible:before {background:var(--accent);}
.resize-handle:hover {background:var(--accent-tint);}
@media(max-width:1280px) {.menu-entry {padding:0 6px;}.project-crumb {display:none;}}
@media(max-width:980px) {.menu-entries {display:none;}.app-titlebar {gap:8px;}}
/* Explicit row placement prevents CSS grid auto-flow when dock stacks swap sides. */
.main-frame > * {grid-row:1;min-height:0;}

/* Native-style dock stacks and inspector fields. */
.left-sidebar,.right-inspector {background:var(--surface-1);}
.dock-panel-header {height:36px;min-height:36px;background:var(--surface-1);border-bottom:1px solid var(--border-soft);}
.dock-panel-toggle {font-size:12px;font-weight:590;padding:0 11px;gap:8px;letter-spacing:-.1px;color:var(--text);}
.dock-panel-toggle svg {color:var(--muted);}
.dock-panel-toggle:hover {background:var(--surface-2);}
.dock-panel-actions {padding:0 8px;}
.left-project-panel,.explorer-panel {min-height:36px;}
.toolbox-panel.dock-closed,.inspector-panel.dock-closed {flex:0 0 36px;}
.project-group {height:35px;font-size:12px;gap:7px;padding:0 12px;color:var(--text);}
.project-group svg {color:var(--muted);}
.diagram-list {padding:1px 8px 12px 23px;}
.diagram-item {height:30px;padding:0 9px;gap:9px;border-radius:5px;font-size:12px;}
.diagram-item.active {background:var(--active);font-weight:560;}
.diagram-item.active svg {color:var(--accent);}
.diagram-item:hover:not(.active) {color:var(--text-strong);}
.palette-scroll {padding:5px 0 22px;}
.palette-quick {margin-bottom:11px;}
.palette-quick-header,.palette-browser-label {height:30px;display:flex;align-items:center;padding:0 13px;
  font-size:10px;font-weight:650;color:var(--muted-deep);letter-spacing:.65px;}
.palette-browser-label {border-top:1px solid var(--border-soft);padding-top:8px;height:37px;}
.palette-quick-list {padding:0 7px;}
.palette-entry {height:31px;min-height:31px;padding:0 14px 0 30px;gap:9px;font-size:12px;color:var(--muted);}
.palette-entry.quick-entry {padding-left:11px;height:31px;min-height:31px;border-radius:5px;}
.palette-entry.active {background:var(--active);color:var(--text-strong);}
.palette-entry:hover {color:var(--text-strong);}
.palette-glyph {color:var(--muted);width:22px;min-width:22px;}
.palette-group-header {height:33px;padding:0 12px;gap:7px;font-size:12px;color:var(--text);font-weight:490;}
.palette-group-header svg {color:var(--muted);}
.group-count {font-size:10px;color:var(--muted-deep);}
.side-search {height:32px;min-height:32px;margin:9px 10px 7px;border-radius:5px;}
.side-search input {font-size:12px;}
.header-icon {border-radius:5px;width:28px;height:28px;}
.explorer-inner {padding:8px 7px 12px;}
.explorer-root,.tree-line {height:29px;font-size:12px;border-radius:4px;}
.tree-line.is-selected {background:var(--active);}
.inspector-tabbar {height:36px;min-height:36px;padding:0 8px;gap:4px;}
.inspector-tabbar>button:not(.icon-button) {font-size:12px;padding:0 11px;}
.inspector-tabbar>button.active:after {background:var(--accent);height:2px;}
.element-identity {margin:14px 13px 15px;gap:10px;padding-bottom:14px;}
.identity-icon {width:36px;height:36px;background:var(--surface-2);border-radius:5px;}
.element-identity h3 {font-size:13px;font-weight:650;}
.element-identity p {font-size:11px;}
.section-heading {height:33px;padding:0 13px;font-size:10px;font-weight:640;color:var(--muted);letter-spacing:.6px;}
.property-list {padding:0 13px 11px;gap:7px;}
.property-row {grid-template-columns:82px minmax(0,1fr);min-height:29px;font-size:12px;gap:8px;}
.faux-input,.faux-select {height:29px;padding:0 8px;border-radius:5px;font-size:12px;background:var(--input-bg);}
.attribute-row {font-size:11px;line-height:1.7;}
.inspector-details {margin:13px 12px 0;}
.inspector-details summary {font-size:12px;padding:11px 2px;}
.appearance-field {padding:0 13px;height:37px;font-size:12px;}
.appearance-field>span {width:74px;flex:0 0 74px;}
.align-buttons {padding-left:88px;}
.swatch {border-radius:4px;}
.position-grid {padding:0 13px 10px;}

/* Diagram workspace: grid and selection belong to canvas, not app chrome. */
.document-tabs {height:39px;min-height:39px;flex:0 0 39px;background:var(--surface-1);}
.doc-tab {max-width:194px;padding:0 16px;gap:9px;font-size:12px;border-right:1px solid var(--border-faint);}
.doc-tab.active {background:var(--app-bg);font-weight:575;}
.doc-tab.active:after {height:2px;}
.doc-tab.active svg {color:var(--accent);}
.document-tab-overflow {height:100%;width:39px;flex:0 0 39px;display:grid;place-items:center;color:var(--muted-deep);border-left:1px solid var(--border-faint);}
.canvas-toolbar {height:39px;flex:0 0 39px;padding:0 10px 0 17px;gap:10px;}
.canvas-path {gap:9px;font-size:12px;}
.canvas-path strong {font-size:12px;color:var(--text-strong);font-weight:540;}
.canvas-path>svg {color:var(--muted-deep);flex-shrink:0;}
.canvas-type-label {margin-left:6px;color:var(--muted-deep);border-left:1px solid var(--border);padding-left:12px;}
.canvas-toolbar-controls {gap:3px;}
.canvas-toolbar-controls .tool-divider {margin:0 7px;}
.canvas-tool-pair {height:29px;padding:2px;display:flex;align-items:center;gap:1px;border:1px solid var(--border-soft);border-radius:5px;background:var(--surface-2);}
.canvas-tool-pair button {height:24px;width:27px;display:grid;place-items:center;background:transparent;border:0;border-radius:4px;color:var(--muted);}
.canvas-tool-pair button.selected {background:var(--surface-1);color:var(--text-strong);box-shadow:0 1px 3px var(--shadow);}
.canvas-tool-pair button:hover:not(.selected) {color:var(--text-strong);}
.canvas-surface {background:var(--canvas);}
.canvas-grid-overlay {background-size:22px 22px;opacity:.88;}
.canvas-grid-overlay:after {background-size:110px 110px;opacity:.4;}
.canvas-content {inset:20px 12px 18px;}
.specimen-diagram {max-width:1060px;max-height:660px;}
.canvas-badge-bg,.canvas-badge-label {display:none;}
.canvas-selection-toolbar {opacity:0;transition:opacity .14s ease;}
.canvas-content:hover .canvas-selection-toolbar {opacity:1;}
.diagram-node .node-fill {filter:none;}
.zoom-indicator {display:none;}
.minimap {border-radius:5px;box-shadow:0 8px 22px var(--shadow);}


.c4-node .c4-box-strip {fill:var(--diagram-border);}
.c4-node.c4-external .c4-box-strip {fill:var(--muted-deep);}
@media(max-width:1160px) {
 .doc-tab {max-width:158px;padding:0 11px;}
 .canvas-type-label {display:none;}
}
@media(max-width:780px) {.canvas-path>span:first-child,.canvas-path>svg {display:none;}.document-tab-overflow {display:none;}}

/* Bottom dock, density and support UI */
.bottom-panel {background:var(--surface-1);min-height:98px;border-top:1px solid var(--border);}
.bottom-tabs {height:37px;min-height:37px;padding:0 10px;gap:6px;}
.bottom-tabs button:not(.icon-button) {font-size:12px;padding:0 12px;}
.bottom-tabs button.active {color:var(--text-strong);font-weight:550;}
.bottom-tabs button.active:after {height:2px;background:var(--accent);}
.bottom-panel-body {padding:11px 15px;overflow-y:auto;}
.relationship-table {width:100%;max-width:940px;display:flex;flex-direction:column;font-size:12px;}
.relationship-th,.relationship-tr {display:grid;grid-template-columns:1.1fr .7fr 1.1fr;align-items:center;gap:13px;min-height:29px;padding:0 10px;}
.relationship-th {height:28px;color:var(--muted-deep);font-weight:610;border-bottom:1px solid var(--border-soft);}
.relationship-tr {border-bottom:1px solid var(--border-faint);color:var(--text);}
.relationship-tr>span:first-child {display:flex;align-items:center;gap:7px;color:var(--text-strong);}
.relationship-tr svg {color:var(--muted-deep);}
.relationship-tr>span:nth-child(2) {color:var(--muted);}
.markdown-panel-preview {max-width:650px;padding:3px 7px 15px;}
.markdown-preview-actions {display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted-deep);font-size:11px;}
.markdown-panel-preview h3 {margin:0 0 5px;color:var(--text-strong);font-size:15px;font-weight:610;}
.markdown-panel-preview p {font-size:12px;line-height:1.7;color:var(--muted);}
.thumbnail-row {display:flex;align-items:center;gap:16px;}
.diagram-thumbnail {width:126px;height:112px;display:flex;flex-direction:column;gap:6px;align-items:stretch;padding:6px;
 border:1px solid var(--border);border-radius:5px;background:var(--surface-2);color:var(--text);text-align:left;font-size:10px;}
.diagram-thumbnail.active {border-color:var(--active-outline);}
.thumbnail-graphic {flex:1;position:relative;background:var(--canvas);border:1px solid var(--border-soft);border-radius:2px;}
.thumbnail-graphic i {position:absolute;display:block;background:var(--diagram-header);border:1px solid var(--diagram-border);width:25px;height:20px;top:25px;}
.thumbnail-graphic i:nth-child(1) {left:12px;}.thumbnail-graphic i:nth-child(2) {left:42px;}.thumbnail-graphic i:nth-child(3) {left:72px;}
.thumbnail-hint {font-size:12px;color:var(--muted);}
.statusbar {height:25px;min-height:25px;flex:0 0 25px;padding:0 14px;font-size:11px;background:var(--surface-1);}
.statusbar-left,.statusbar-right {gap:9px;}
.status-sep {background:var(--border);}
.selected-toast {border-radius:5px;}
.gallery-view,.design-system-view {background:var(--app-bg);}
.symbol-card {border-radius:5px;}
@media(max-width:1030px) {.menu-entry {padding:0 5px;}}


/* Semantic notation styles by diagram family. */
/* core diagram notation */
.specimen-diagram text {
  font-family: Inter,"Segoe UI",Arial,sans-serif;
  user-select: none;
}

.diagram-node .node-fill {
  fill: var(--paper-white);
  stroke: var(--diagram-border);
  stroke-width: 1.5;
  filter: drop-shadow(0 2px 2px rgba(20,36,48,.04));
}

.diagram-node .class-header-fill {
  fill: var(--diagram-header);
  stroke: none;
}

.diagram-node .node-divider {
  stroke: var(--diagram-border);
  stroke-width: 1.1;
  fill: none;
}

.diagram-node .node-title {
  fill: var(--diagram-text);
  font-size: 16px;
  font-weight: 670;
  letter-spacing: -.1px;
}

.diagram-node .node-stereotype {
  fill: var(--diagram-muted);
  font-size: 12px;
  font-style: italic;
}

.diagram-node .node-detail {
  fill: var(--diagram-text);
  font-size: 13px;
  font-weight: 400;
  font-family: ui-monospace,SFMono-Regular,Consolas,monospace;
}

.diagram-node.muted-node {
  opacity: .7;
}

.diagram-relation .relation-path {
  stroke: var(--diagram-edge);
  stroke-width: 1.7;
  fill: none;
}

.relation-label-bg {
  fill: var(--canvas);
}

.relation-label {
  font-size: 12px;
  fill: var(--diagram-muted);
  font-weight: 500;
}

.relation-small {
  font-size: 12px;
  fill: var(--diagram-muted);
}

.canvas-badge-bg {
  fill: color-mix(in srgb,var(--diagram-edge) 11%,var(--canvas));
  stroke: color-mix(in srgb,var(--diagram-edge) 25%,transparent);
  stroke-width: .7;
}

.canvas-badge-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.2px;
  fill: var(--diagram-muted);
}

.selection-outline {
  pointer-events: none;
}

.mini-toolbar-bg {
  fill: var(--paper-white);
  stroke: var(--canvas-grid-strong);
  filter: drop-shadow(0 2px 4px var(--shadow));
}

.mini-toolbar-divider {
  stroke: var(--canvas-grid-strong);
  stroke-width: 1;
}

.canvas-selection-toolbar text {
  fill: var(--diagram-muted);
  font-size: 14px;
}

/* c4 diagram notation */
.c4-boundary {
  fill: color-mix(in srgb,var(--diagram-edge) 3%,transparent);
  stroke: var(--diagram-edge);
  stroke-width: 1.7;
  stroke-dasharray: 9 6;
}

.boundary-title {
  font-size: 13px;
  fill: var(--diagram-text);
  font-weight: 740;
  letter-spacing: .9px;
}

.boundary-subtitle {
  font-size: 12px;
  fill: var(--diagram-muted);
}

.c4-node .c4-box {
  fill: var(--paper-white);
  stroke: var(--diagram-border);
  stroke-width: 1.5;
}

.c4-node .c4-box-strip {
  fill: #7591b2;
}

.c4-node.c4-external .c4-box {
  stroke-dasharray: 5 4;
}

.c4-node.c4-external .c4-box-strip {
  fill: #abb2bd;
}

.c4-role {
  font-size: 10px;
  letter-spacing: 1px;
  font-weight: 730;
  fill: var(--diagram-muted);
}

.c4-title {
  font-size: 16px;
  font-weight: 690;
  fill: var(--diagram-text);
}

.c4-subtitle {
  font-size: 12px;
  fill: var(--diagram-muted);
}

.c4-database {
  fill: none;
  stroke: var(--diagram-edge);
  stroke-width: 1.5;
}

.c4-person {
  fill: none;
  stroke: var(--diagram-edge);
  stroke-width: 2;
}

.c4-person text {
  stroke: none;
}

.c4-links path {
  stroke: var(--diagram-edge);
  stroke-width: 1.6;
  fill: none;
}

.c4-edge-label text {
  fill: var(--diagram-muted);
  font-size: 12px;
}

.diagram-mini-action rect {
  fill: var(--paper-white);
  stroke: var(--canvas-grid-strong);
}

.diagram-mini-action text {
  font-size: 12px;
  fill: var(--diagram-text);
}

/* mindmap diagram notation */
.mind-edges path {
  fill: none;
  stroke-width: 3;
  stroke-linecap: round;
}

.mind-edges path.child-edge {
  stroke-width: 1.5;
  stroke-dasharray: 5 4;
}

.mind-blue {
  stroke: #6a96ba;
}

.mind-amber {
  stroke: #b8a071;
}

.mind-teal {
  stroke: #8194aa;
}

.mind-violet {
  stroke: #9b92bb;
}

.mind-rose {
  stroke: #c3959c;
}

.mind-topic > rect:first-child {
  fill: var(--paper-white);
  stroke: var(--diagram-border);
  stroke-width: 1.15;
  filter: drop-shadow(0 2px 2px rgba(20,30,45,.03));
}

.mind-topic .mind-accent {
  fill: #738b9b;
  stroke: none;
}

.mind-topic-title {
  font-size: 16px;
  font-weight: 690;
  fill: var(--diagram-text);
}

.mind-topic-sub {
  font-size: 12px;
  fill: var(--diagram-muted);
}

.mind-root > rect:first-child {
  fill: var(--diagram-header);
  stroke: var(--diagram-border);
  stroke-width: 1.6;
}

.mind-root .mind-accent {
  fill: var(--selection);
}

.mind-root .mind-topic-title {
  font-size: 20px;
}

.mind-blue .mind-accent {
  fill: #6a96ba;
}

.mind-amber .mind-accent {
  fill: #b8a071;
}

.mind-teal .mind-accent {
  fill: #8194aa;
}

.mind-violet .mind-accent {
  fill: #9b92bb;
}

.mind-rose .mind-accent {
  fill: #c3959c;
}

.mind-caption {
  fill: var(--diagram-muted);
  font-size: 11px;
}

/* flowchart diagram notation */
.flow-node-fill {
  fill: var(--paper-white);
  stroke: var(--diagram-border);
  stroke-width: 1.6;
}

.flow-terminal {
  fill: var(--diagram-header);
}

.flow-node-title {
  font-size: 15px;
  font-weight: 680;
  fill: var(--diagram-text);
}

.flow-arrows path {
  stroke: var(--diagram-edge);
  stroke-width: 1.8;
  fill: none;
  marker-end: url(#flow-arrow);
}

.flow-edge-label text {
  font-size: 13px;
  fill: var(--diagram-muted);
  font-weight: 650;
}

.flow-note rect {
  fill: var(--paper-white);
  stroke: var(--canvas-grid-strong);
  stroke-width: 1;
}

.flow-note text:first-of-type {
  font-size: 15px;
  font-weight: 650;
  fill: var(--diagram-text);
}

.flow-note text:not(:first-of-type) {
  font-size: 12px;
  fill: var(--diagram-muted);
}

.flow-note path {
  stroke: var(--diagram-edge);
  stroke-width: 1;
  fill: none;
}


/* Gallery and design-system styling. */
/* gallery-library grouped styles */
/* gallery-library / 01 */
.gallery-view,.design-system-view {
  min-width: 0;
  min-height: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--surface-1);
}
.gallery-header {
  padding: 35px 36px 26px;
  border-bottom: 1px solid var(--border-soft);
}
.gallery-eyebrow,.eyebrow {
  color: var(--accent);
  letter-spacing: 1.25px;
  font-size: 10px;
  font-weight: 730;
}
.gallery-header h1 {
  font-size: 27px;
  font-weight: 680;
  letter-spacing: -.9px;
  margin: 9px 0 7px;
  line-height: 1.2;
  color: var(--text-strong);
}
.gallery-header p {
  color: var(--muted);
  max-width: 610px;
  line-height: 1.6;
  margin: 0;
  font-size: 12px;
}
.gallery-family-tabs {
  display: flex;
  align-items: stretch;
  gap: 6px;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  height: 45px;
  min-height: 45px;
}
.gallery-family-tabs button {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 100%;
  padding: 0 14px;
  background: none;
  color: var(--muted);
  border: 0;
  position: relative;
  font-size: 11px;
}
.gallery-family-tabs button.active {
  color: var(--text-strong);
}
.gallery-family-tabs button.active:after {
  content: "";
  height: 2px;
  background: var(--accent);
  position: absolute;
  bottom: 0;
  left: 9px;
  right: 9px;
}
.gallery-family-tabs small {
  color: var(--muted-deep);
  font-size: 9px;
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  padding: 1px 5px;
  border-radius: 3px;
}
.gallery-scroll,.system-scroll {
  flex: 1;
  overflow: auto;
  padding: 24px 34px 50px;
  min-height: 0;
}
.library-context {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  align-items: center;
  margin-bottom: 16px;
}
.library-context>div:first-child {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}
.library-title {
  font-size: 14px;
  font-weight: 650;
  color: var(--text-strong);
}
.library-description {
  color: var(--muted-deep);
  font-size: 11px;
}
.gallery-meta {
  font-size: 10px;
  color: var(--muted-deep);
  display: flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
}
.gallery-section {
  padding: 8px 0 18px;
}
.gallery-section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-soft);
  padding: 0 0 11px;
  margin-bottom: 14px;
}
.gallery-section-head h2 {
  font-size: 11px;
  font-weight: 650;
  margin: 0;
  color: var(--text);
}
.gallery-section-head span {
  font-size: 10px;
  color: var(--muted-deep);
}
.symbol-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(118px,1fr));
  gap: 9px;
}
.symbol-card {
  height: 108px;
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  border-radius: 4px;
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 8px 9px;
  gap: 2px;
  text-align: left;
  min-width: 0;
}
.symbol-card:hover,.symbol-card.selected {
  border-color: var(--active-outline);
  background: var(--active);
}
.symbol-preview {
  height: 48px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: var(--muted);
}
.symbol-card.selected .symbol-preview {
  color: var(--accent);
}

/* gallery-library / 02 */
.symbol-name {
  font-size: 10.5px;
  font-weight: 590;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.symbol-identifier {
  font-size: 9px;
  color: var(--muted-deep);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.gallery-disclaimer {
  font-size: 10px;
  color: var(--muted-deep);
  border-top: 1px solid var(--border-soft);
  padding-top: 14px;
  line-height: 1.5;
}
.diagram-types-details {
  margin: 10px 0 18px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: 4px;
}
.diagram-types-details summary {
  height: 38px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 13px;
  cursor: pointer;
  color: var(--text);
  font-size: 11px;
  list-style: none;
}
.diagram-types-details summary::-webkit-details-marker {
  display: none;
}
.diagram-types-details summary>svg:first-child {
  color: var(--accent);
}
.diagram-types-details summary>svg:last-child {
  margin-left: 0;
  color: var(--muted-deep);
}
.diagram-types-details[open] summary>svg:last-child {
  transform: rotate(180deg);
}
.type-count {
  color: var(--muted-deep);
  font-size: 10px;
  margin-left: auto;
}
.diagram-type-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 6px;
  padding: 13px;
  border-top: 1px solid var(--border-soft);
}
.diagram-type-grid span {
  font-size: 10px;
  color: var(--muted);
  padding: 7px 9px;
  background: var(--surface-1);
  border: 1px solid var(--border-soft);
  border-radius: 3px;
}


/* gallery-system grouped styles */
/* gallery-system / 01 */
.system-scroll {
  padding-top: 26px;
}
.system-intro {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 17px 18px;
  margin-bottom: 24px;
}
.system-intro .eyebrow {
  color: var(--muted-deep);
  font-size: 9px;
}
.current-theme-line {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 11px;
}
.current-theme-line strong {
  color: var(--text-strong);
  font-size: 14px;
}
.current-theme-line>span:last-child {
  color: var(--muted);
  font-size: 11px;
  margin-left: auto;
  text-align: right;
}
.scheme-visual {
  display: block;
  width: 29px;
  height: 29px;
  background: var(--canvas);
  border: 7px solid var(--surface-3);
  outline: 1px solid var(--border);
  border-radius: 3px;
}
.system-section {
  margin-bottom: 29px;
}
.system-section-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 13px;
}
.system-section-heading h2 {
  margin: 0;
  color: var(--text);
  font-size: 13px;
  font-weight: 690;
}
.system-section-heading>span {
  color: var(--muted-deep);
  font-size: 10px;
}
.token-grid {
  display: grid;
  grid-template-columns: repeat(5,minmax(0,1fr));
  gap: 8px;
}
.token-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px;
  border: 1px solid var(--border-soft);
  border-radius: 4px;
  min-width: 0;
  background: var(--surface-2);
}
.token-swatch {
  display: block;
  height: 38px;
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 3px;
}
.token-card code {
  font: 10px ui-monospace,SFMono-Regular,Consolas,monospace;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
}
.primitives-example {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
  padding: 20px;
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  border-radius: 4px;
}
.primitives-example button {
  height: 30px;
  padding: 0 13px;
  border-radius: 3px;
  font-size: 11px;
}
.example-primary {
  background: var(--accent);
  color: var(--app-bg);
  font-weight: 650;
  border: 1px solid var(--accent);
}
.example-secondary {
  background: var(--surface-3);
  color: var(--text);
  border: 1px solid var(--border);
}
.example-quiet {
  display: flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  color: var(--muted);
  border: 1px solid transparent;
}
.demo-chip {
  font-size: 10px;
  background: var(--active);
  color: var(--accent);
  padding: 6px 10px;
  border: 1px solid var(--active-outline);
  border-radius: 3px;
}
.demo-outline {
  font-size: 10px;
  color: var(--muted);
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 3px;
}
.field-examples {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-top: 11px;
}
.field-examples>div {
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-width: 0;
}
.field-examples small {
  font-size: 9px;
  color: var(--muted-deep);
  font-weight: 650;
  letter-spacing: .6px;
}
.field-examples>div>span {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 32px;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 0 10px;
  color: var(--text);
  font-size: 11px;
}

/* gallery-system / 02 */
.mini-toggle {
  width: 23px;
  height: 13px;
  border-radius: 8px;
  background: var(--accent);
  position: relative;
}
.mini-toggle:after {
  content: "";
  width: 9px;
  height: 9px;
  background: var(--surface-1);
  border-radius: 50%;
  position: absolute;
  right: 2px;
  top: 2px;
}
.system-shapes {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 9px;
}
.system-shapes>div {
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  display: flex;
  gap: 8px;
  align-items: center;
  flex-direction: column;
  padding: 14px 5px;
  border-radius: 4px;
}
.system-shapes svg {
  color: var(--muted);
}
.system-shapes span {
  font-size: 10px;
  color: var(--muted);
}
.mapping-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 8px;
}
.mapping-row {
  display: flex;
  gap: 11px;
  align-items: center;
  min-width: 0;
  border: 1px solid var(--border-soft);
  background: var(--surface-2);
  border-radius: 4px;
  padding: 12px;
}
.mapping-row>svg:first-child {
  color: var(--accent);
  flex-shrink: 0;
}
.mapping-row>svg:last-child {
  margin-left: auto;
  color: var(--muted-deep);
  flex-shrink: 0;
}
.mapping-row div {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.mapping-row strong {
  font-size: 11px;
  color: var(--text);
  font-weight: 590;
}
.mapping-row span {
  font-size: 10px;
  color: var(--muted-deep);
}
.system-footer-note {
  padding: 14px 0;
  border-top: 1px solid var(--border-soft);
  display: flex;
  gap: 9px;
  color: var(--muted-deep);
  font-size: 10px;
  align-items: center;
}


/* responsive view */
@media (max-width:1200px) {
  .gallery-header {
    padding: 27px 26px 21px;
  }
  .gallery-scroll,.system-scroll {
    padding: 20px 24px 35px;
  }
  .symbol-grid {
    grid-template-columns: repeat(auto-fill,minmax(112px,1fr));
  }
  .token-grid {
    grid-template-columns: repeat(4,minmax(0,1fr));
  }
  .mapping-grid {
    grid-template-columns: 1fr;
  }
}
